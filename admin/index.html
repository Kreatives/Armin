<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content editor — Armin Shah</title>
  <link rel="stylesheet" href="/admin/admin.css?v=8" />
</head>
<body>
  <!-- Login -->
  <div class="login" id="login">
    <form class="login__card" id="login-form">
      <h1 class="login__title">Content editor</h1>
      <p class="login__sub">Log in om de teksten en media van de website te beheren.</p>
      <label class="field">
        <span class="field__label">E-mail</span>
        <input class="field__input" type="email" id="login-email" autocomplete="username" required />
      </label>
      <label class="field">
        <span class="field__label">Wachtwoord</span>
        <input class="field__input" type="password" id="login-pass" autocomplete="current-password" required />
      </label>
      <button class="btn btn--primary" type="submit" id="login-btn">Inloggen</button>
      <p class="login__error" id="login-error" role="alert"></p>
    </form>
  </div>

  <!-- App -->
  <div class="app" id="app" hidden>
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__mark">A</span>
        <span>Content editor</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar__user">
        <span class="sidebar__email" id="user-email"></span>
        <button class="btn btn--ghost btn--sm" id="logout-btn" type="button">Uitloggen</button>
      </div>
    </aside>

    <main class="main">
      <header class="main__head" id="main-head"></header>
      <div class="main__body" id="panel"></div>
    </main>
  </div>

  <!-- Opslaan-melding -->
  <div class="toast" id="toast" hidden></div>

  <script src="/cms/config.js?v=8"></script>
  <script src="/cms/shared.js?v=8"></script>
  <script src="/cms/manifest.js?v=8"></script>
  <script src="/cms/media-manifest.js?v=8"></script>
  <script src="/cases.js?v=8"></script>
  <script type="module" src="/admin/admin.js?v=8"></script>
</body>
</html>
