<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case — Armin Shah</title>

  <link rel="preconnect" href="https://use.typekit.net" crossorigin />
  <link rel="stylesheet" href="https://use.typekit.net/far7gpv.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="case.css" />
</head>
<body class="case-page">
  <div class="bg" aria-hidden="true"></div>
  <div class="grid-lines" aria-hidden="true"></div>

  <main class="case-detail" data-case-root></main>

  <!-- Volgende case (wordt gevuld door JS) -->
  <section class="cd-next" data-case-next></section>

  <!-- Zwevende dock-navigatie (sticky onderaan) -->
  <nav class="dock" aria-label="Hoofdmenu">
    <div class="dock__links">
      <a class="dock__link" href="/" data-sec="home">Home</a>
      <a class="dock__link" href="/#werk" data-sec="werk">Work</a>
      <a class="dock__link" href="/about" data-sec="about">About</a>
      <a class="dock__link" href="https://substack.com/@arminshah" target="_blank" rel="noopener" data-sec="nieuwsbrief">Newsletter</a>
    </div>
    <a class="dock__cta" href="mailto:hello@arminshah.nl">Let’s talk</a>
  </nav>
  <script>
  (function () {
    var dock = document.querySelector('.dock');
    if (!dock) return;
    function upd() { dock.classList.toggle('is-visible', window.scrollY > 90); }
    upd();
    window.addEventListener('scroll', upd, { passive: true });
    window.addEventListener('resize', upd);
  })();
  </script>

  <!-- Footer (gelijk aan de homepage) -->
  <footer class="contact" id="contact">
    <div class="contact__inner">
      <div class="contact__cols">
        <div class="contact__col" data-reveal>
          <p class="contact__label">Contact</p>
          <a class="contact__link contact__link--lg" href="mailto:hello@arminshah.nl">hello@arminshah.nl</a>
          <a class="contact__link contact__link--lg" href="https://wa.me/31640908692">+31 6 40 90 86 92 (WhatsApp)</a>
        </div>
        <div class="contact__col" data-reveal>
          <p class="contact__label">Pages</p>
          <a class="contact__link" href="/#hero">Home</a>
          <a class="contact__link" href="/#werk">Work</a>
          <a class="contact__link" href="/about">About</a>
          <a class="contact__link" href="https://substack.com/@arminshah" target="_blank" rel="noopener">Newsletter</a>
        </div>
        <div class="contact__col" data-reveal>
          <p class="contact__label">Socials</p>
          <a class="contact__link" href="https://www.instagram.com/arminxshah/?hl=en" target="_blank" rel="noopener">Instagram</a>
          <a class="contact__link" href="https://linkedin.com/in/armin-shah-b2a626143?originalSubdomain=nl" target="_blank" rel="noopener">LinkedIn</a>
          <a class="contact__link" href="https://substack.com/@arminshah" target="_blank" rel="noopener">Substack</a>
        </div>
        <div class="contact__col" data-reveal>
          <p class="contact__label">Based in</p>
          <p class="contact__link">Armin Shah</p>
        </div>
      </div>
      <div class="contact__divider"></div>
      <p class="contact__copy">© 2026 Armin Shah</p>
    </div>
    <div class="contact__wordmark" aria-hidden="true">ARMIN SHAH</div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="cases.js"></script>
  <!-- CMS: config + manifest + helpers (loader onderaan start renderCase) -->
  <script src="cms/config.js"></script>
  <script src="cms/shared.js"></script>
  <script src="cms/manifest.js"></script>
  <script>
  function renderCase() {
    /* Gedeelde case-teksten komen uit het CMS (window.CMS_TEXT), met de
       originele tekst als fallback. */
    var T = window.CMS_TEXT || {};
    function t(key, def) { return (T[key] != null && String(T[key]).trim() !== '') ? T[key] : def; }

    var cases = window.CASES || [];
    var root = document.querySelector('[data-case-root]');
    var nextRoot = document.querySelector('[data-case-next]');

    if (!cases.length) { root.innerHTML = '<p style="padding:6rem 0;color:#888">No cases found.</p>'; return; }

    var slug = new URLSearchParams(location.search).get('case');
    var idx = cases.findIndex(function (c) { return c.slug === slug; });
    if (idx < 0) idx = 0;
    var c = cases[idx];
    var next = cases[(idx + 1) % cases.length];
    document.title = c.title + ' — Armin Shah';

    var LABEL = t('case.hero.label', 'Case');
    var NEXT_EYEBROW = t('case.next.eyebrow', 'Next case');

    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function isVideo(src) { return /\.mp4$/i.test(src); }
    function mediaTag(src, cls) {
      return isVideo(src)
        ? '<video class="' + cls + '" src="' + src + '" autoplay muted loop playsinline preload="metadata"></video>'
        : '<img class="' + cls + '" src="' + src + '" alt="" loading="lazy" />';
    }

    /* Media gegroepeerd per oriëntatie -> nette grids, aspect-ratio behouden. */
    function buildBlocks(media) {
      var blocks = [], i = 0;
      while (i < media.length) {
        var portrait = media[i].portrait, group = [];
        while (i < media.length && media[i].portrait === portrait) { group.push(media[i]); i++; }
        var cls = portrait ? 'cd-mediagrid--portrait' : 'cd-mediagrid--landscape';
        blocks.push('<div class="cd-mediagrid ' + cls + '" data-reveal>' +
          group.map(function (m) { return mediaTag(m.src, 'cd-media'); }).join('') + '</div>');
      }
      return blocks;
    }

    var coverFig = '<figure class="cd-cover ' + (c.cover.portrait ? 'cd-cover--portrait' : 'cd-cover--landscape') + '" data-reveal>' +
      mediaTag(c.cover.src, 'cd-cover__media') +
      '<figcaption class="cd-caption">' + esc(c.title) + '</figcaption></figure>';

    var blocks = buildBlocks(c.media || []);
    var third = Math.ceil(blocks.length / 2);
    var g1 = blocks.slice(0, third).join(''), g2 = blocks.slice(third).join('');

    /* Per-case metadata (alleen tonen wat ingevuld is). */
    function metaGroup(label, val) {
      if (!val) return '';
      return '<div class="cd-meta__group"><dt class="cd-meta__label">' + esc(label) +
        '</dt><dd class="cd-meta__value">' + esc(val) + '</dd></div>';
    }
    var servicesArr = (c.services_list && c.services_list.length) ? c.services_list : (c.services ? [c.services] : []);
    var metaHTML =
      metaGroup('Client', c.client) +
      metaGroup('Publisher', c.publisher) +
      metaGroup('Agency partner', c.agency_partner) +
      metaGroup('Project type', c.project_type) +
      metaGroup('Role', c.role) +
      metaGroup('Services', servicesArr.join(', '));

    var intro = c.intro || c.summary || '';
    var bodyParas = (c.body || '').split(/\n+/).filter(Boolean).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    var bodyHTML = bodyParas
      ? '<section class="cd-section" data-reveal><div class="cd-section__main"><div class="cd-section__text">' + bodyParas + '</div></div></section>'
      : '';

    root.innerHTML =
      '<a class="cd-back" href="/#werk">' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      'Back to work</a>' +
      '<header class="cd-hero">' +
        '<p class="cd-label" data-reveal>' + esc(LABEL) + '</p>' +
        (c.logo ? '<img class="cd-logo" src="' + c.logo + '" alt="' + esc(c.title) + ' logo" data-reveal />' : '') +
        '<h1 class="cd-hero__title" data-reveal>' + esc(c.title) + '</h1>' +
        (intro ? '<p class="cd-hero__summary" data-reveal>' + esc(intro) + '</p>' : '') +
        '<dl class="cd-meta" data-reveal>' + metaHTML + '</dl>' +
      '</header>' +
      coverFig +
      '<article class="cd-body">' + g1 + bodyHTML + g2 + '</article>';

    nextRoot.innerHTML =
      '<a class="cd-next__link cd-bleed" href="/case?case=' + encodeURIComponent(next.slug) + '">' +
      '<img class="cd-next__bg" src="' + next.thumb + '" alt="" />' +
      '<span class="cd-next__inner">' +
        '<span class="cd-next__eyebrow">' + esc(NEXT_EYEBROW) + '</span>' +
        '<span class="cd-next__title">' + esc(next.title) + '</span>' +
      '</span>' +
      '<span class="cd-next__arrow" aria-hidden="true">→</span></a>';

    /* Rustige reveals (bewezen patroon uit script.js) */
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && window.gsap) {
      document.body.classList.add('has-reveal');
      gsap.registerPlugin(ScrollTrigger);
      document.querySelectorAll('[data-reveal]').forEach(function (el) {
        gsap.fromTo(el, { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out', scrollTrigger: { trigger: el, start: 'top 88%' } });
      });
    }
  }
  window.renderCase = renderCase;
  </script>
  <!-- CMS: haalt cases + gedeelde teksten op en roept daarna renderCase() aan -->
  <script type="module" src="cms/loader.js"></script>
</body>
</html>
