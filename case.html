<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case — Armin Shah</title>

  <link rel="preconnect" href="https://use.typekit.net" crossorigin />
  <link rel="stylesheet" href="https://use.typekit.net/far7gpv.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="case.css" />
</head>
<body class="case-page">
  <div class="bg" aria-hidden="true"></div>
  <div class="grid-lines" aria-hidden="true"></div>

  <main class="case-detail" data-case-root></main>

  <!-- Volgende case (wordt gevuld door JS) -->
  <section class="cd-next" data-case-next></section>

  <!-- Footer (gelijk aan de homepage) -->
  <footer class="contact" id="contact">
    <div class="contact__inner">
      <div class="contact__cols">
        <div class="contact__col" data-reveal>
          <p class="contact__label">Contact</p>
          <a class="contact__link contact__link--lg" href="mailto:hello@arminshah.nl">hello@arminshah.nl</a>
          <a class="contact__link contact__link--lg" href="https://wa.me/31612345678">+31 6 12 34 56 78 (WhatsApp)</a>
        </div>
        <div class="contact__col" data-reveal>
          <p class="contact__label">Pages</p>
          <a class="contact__link" href="index.html#hero">Home</a>
          <a class="contact__link" href="index.html#werk">Work</a>
          <a class="contact__link" href="about.html">About</a>
          <a class="contact__link" href="index.html#nieuwsbrief">Newsletter</a>
        </div>
        <div class="contact__col" data-reveal>
          <p class="contact__label">Socials</p>
          <a class="contact__link" href="#" rel="noopener">Instagram</a>
          <a class="contact__link" href="#" rel="noopener">LinkedIn</a>
          <a class="contact__link" href="#" rel="noopener">YouTube</a>
        </div>
        <div class="contact__col" data-reveal>
          <p class="contact__label">Based in</p>
          <p class="contact__link">Armin Shah</p>
          <p class="contact__link">Amsterdam, NL</p>
        </div>
      </div>
      <div class="contact__divider"></div>
      <p class="contact__copy">© 2026 Armin Shah</p>
    </div>
    <div class="contact__wordmark" aria-hidden="true">ARMIN SHAH</div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="cases.js"></script>
  <script>
  (function () {
    var cases = window.CASES || [];
    var root = document.querySelector('[data-case-root]');
    var nextRoot = document.querySelector('[data-case-next]');

    if (!cases.length) { root.innerHTML = '<p style="padding:6rem 0;color:#888">No cases found.</p>'; return; }

    var slug = new URLSearchParams(location.search).get('case');
    var idx = cases.findIndex(function (c) { return c.slug === slug; });
    if (idx < 0) idx = 0;
    var c = cases[idx];
    var next = cases[(idx + 1) % cases.length];
    document.title = c.title + ' — Armin Shah';

    /* Vaste, gedeelde body-copy -> elke case identieke opbouw */
    var SECTIONS = [
      { index: '01', title: 'The brief', body:
        ['Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.',
         'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt.'] },
      { index: '02', title: 'The approach', body:
        ['Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.',
         'Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt.'] },
      { index: '03', title: 'The result', body:
        ['At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident.',
         'Et harum quidem rerum facilis est et expedita distinctio. Nam libero tempore, cum soluta nobis est eligendi optio cumque nihil impedit quo minus id quod maxime placeat.'] }
    ];
    var QUOTE = { text: 'Football is the language, culture is the story', cite: '— Armin Shah' };

    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function isVideo(src) { return /\.mp4$/i.test(src); }
    function mediaTag(src, cls) {
      return isVideo(src)
        ? '<video class="' + cls + '" src="' + src + '" autoplay muted loop playsinline preload="metadata"></video>'
        : '<img class="' + cls + '" src="' + src + '" alt="" loading="lazy" />';
    }

    /* Media gegroepeerd per oriëntatie -> nette grids, aspect-ratio behouden.
       Portret (9:16) = rij gecentreerde frames; landscape (16:9) = rij die de breedte vult. */
    function buildBlocks(media) {
      var blocks = [], i = 0;
      while (i < media.length) {
        var portrait = media[i].portrait, group = [];
        while (i < media.length && media[i].portrait === portrait) { group.push(media[i]); i++; }
        var cls = portrait ? 'cd-mediagrid--portrait' : 'cd-mediagrid--landscape';
        blocks.push('<div class="cd-mediagrid ' + cls + '" data-reveal>' +
          group.map(function (m) { return mediaTag(m.src, 'cd-media'); }).join('') + '</div>');
      }
      return blocks;
    }

    function sectionHTML(s) {
      return '<section class="cd-section" data-reveal>' +
        '<p class="cd-section__index">' + esc(s.index) + '</p>' +
        '<div class="cd-section__main"><h2 class="cd-section__title">' + esc(s.title) + '</h2>' +
        '<div class="cd-section__text">' + s.body.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div></div></section>';
    }

    var coverFig = '<figure class="cd-cover ' + (c.cover.portrait ? 'cd-cover--portrait' : 'cd-cover--landscape') + '" data-reveal>' +
      mediaTag(c.cover.src, 'cd-cover__media') +
      '<figcaption class="cd-caption">' + esc(c.title) + ', image from the case</figcaption></figure>';

    var blocks = buildBlocks(c.media || []);
    var t = Math.ceil(blocks.length / 3);
    var g1 = blocks.slice(0, t).join(''), g2 = blocks.slice(t, t * 2).join(''), g3 = blocks.slice(t * 2).join('');

    var metaHTML =
      metaGroup('Client', c.client) + metaGroup('Date', c.date) +
      metaGroup('Role', c.role) + metaGroup('Services', c.services);
    function metaGroup(label, val) {
      return '<div class="cd-meta__group"><dt class="cd-meta__label">' + esc(label) +
        '</dt><dd class="cd-meta__value">' + esc(val) + '</dd></div>';
    }

    root.innerHTML =
      '<a class="cd-back" href="index.html#werk">' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      'Back to work</a>' +
      '<header class="cd-hero">' +
        '<p class="cd-label" data-reveal>Case</p>' +
        (c.logo ? '<img class="cd-logo" src="' + c.logo + '" alt="' + esc(c.title) + ' logo" data-reveal />' : '') +
        '<h1 class="cd-hero__title" data-reveal>' + esc(c.title) + '</h1>' +
        '<p class="cd-hero__summary" data-reveal>' + esc(c.summary) + '</p>' +
        '<dl class="cd-meta" data-reveal>' + metaHTML + '</dl>' +
      '</header>' +
      coverFig +
      '<article class="cd-body">' +
        sectionHTML(SECTIONS[0]) + g1 +
        sectionHTML(SECTIONS[1]) +
        '<blockquote class="cd-quote" data-reveal><p>' + esc(QUOTE.text) + '</p><cite>' + esc(QUOTE.cite) + '</cite></blockquote>' +
        g2 +
        sectionHTML(SECTIONS[2]) + g3 +
      '</article>';

    nextRoot.innerHTML =
      '<a class="cd-next__link cd-bleed" href="case.html?case=' + encodeURIComponent(next.slug) + '">' +
      '<img class="cd-next__bg" src="' + next.thumb + '" alt="" />' +
      '<span class="cd-next__inner">' +
        '<span class="cd-next__eyebrow">Next case</span>' +
        '<span class="cd-next__title">' + esc(next.title) + '</span>' +
      '</span>' +
      '<span class="cd-next__arrow" aria-hidden="true">→</span></a>';

    /* Rustige reveals (bewezen patroon uit script.js) */
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && window.gsap) {
      document.body.classList.add('has-reveal');
      gsap.registerPlugin(ScrollTrigger);
      document.querySelectorAll('[data-reveal]').forEach(function (el) {
        gsap.fromTo(el, { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out', scrollTrigger: { trigger: el, start: 'top 88%' } });
      });
    }
  })();
  </script>
</body>
</html>
